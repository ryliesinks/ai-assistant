<!DOCTYPE html>

<html>

<head>

    <title>Company Knowledge AI</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
        }

        textarea {
            width: 100%;
            height: 100px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
        }

        #answer {
            margin-top: 30px;
            white-space: pre-wrap;
        }

        .source {
            margin-top: 8px;
            padding: 8px;
            background: #eee;
        }

    </style>

</head>


<body>


<h1>Company Knowledge AI</h1>


<p>
    Ask a question about company policies.
</p>


<textarea
    id="question"
    placeholder="What is our damaged merchandise policy?"
></textarea>


<br>


<button onclick="askQuestion()">

    Ask

</button>


<div id="answer"></div>

<div id="sources"></div>


<script>


async function askQuestion() {

    const question =
        document.getElementById(
            "question"
        ).value;


    const response = await fetch(
        "/ask",
        {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body: JSON.stringify({
                question
            })
        }
    );


    const data =
        await response.json();


    document.getElementById(
        "answer"
    ).innerText = data.answer;


    const sources =
        document.getElementById(
            "sources"
        );


    sources.innerHTML =
        "<h3>Sources</h3>";


    for (
        const source
        of data.sources
    ) {

        const element =
            document.createElement(
                "div"
            );


        element.className =
            "source";


        element.innerText =
            source.source_name
            +
            " — Page "
            +
            source.page_number;


        sources.appendChild(
            element
        );
    }
}


</script>


</body>

</html>
